
project:
  name: weather-intelligence-platform
  version: "1.0"

source:
  provider: open_meteo

  endpoints:
    historical: https://archive-api.open-meteo.com/v1/archive
    forecast: https://api.open-meteo.com/v1/forecast

  request:
    timezone: UTC
    temperature_unit: celsius
    wind_speed_unit: kmh
    precipitation_unit: mm

historical:
  lookback_years: 3
  refresh_frequency: daily

  # Conservative delay to avoid requesting incomplete recent data.
  # We will validate this against actual API availability.
  end_date_lag_days: 5

  hourly_variables:
    - temperature_2m
    - relative_humidity_2m
    - precipitation
    - rain
    - weather_code
    - surface_pressure
    - cloud_cover
    - wind_speed_10m
    - wind_direction_10m
    - wind_gusts_10m

forecast:
  horizon_days: 7
  refresh_frequency: daily

  hourly_variables:
    - temperature_2m
    - relative_humidity_2m
    - precipitation
    - rain
    - precipitation_probability
    - weather_code
    - surface_pressure
    - cloud_cover
    - wind_speed_10m
    - wind_direction_10m
    - wind_gusts_10m

storage:
  bronze:
    format: json
    preserve_original_response: true
    include_request_metadata: true

  silver:
    format: parquet
    timestamp_timezone: UTC

  gold:
    format: parquet
    timestamp_timezone: UTC

data_quality:
  reject_invalid_coordinates: true
  reject_duplicate_records: true
  validate_required_fields: true
  validate_timestamps: true

  # Values outside these ranges should be investigated.
  # They are sanity checks, not universal climate limits.
  temperature_c:
    min: -90
    max: 65

  relative_humidity_pct:
    min: 0
    max: 100

  precipitation_mm:
    min: 0

  wind_speed_kmh:
    min: 0
